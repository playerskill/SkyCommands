# ================================================
#  SkyCommands — ядро игровых команд SkyGame
#  Каждая команда имеет тумблер enabled: false —
#  команда перестаёт перехватываться и уходит
#  в другие плагины (Essentials и т.д.) как раньше.
# ================================================

messages:
  # Префикс для всех сообщений команд
  prefix: "&8[&6SkyCommands&8] &r"
  # Стандартное сообщение об отсутствии прав —
  # общее для всех команд. Если у конкретной команды
  # в её секции задан error-message — используется он.
  no-permission: "&cУ вас нет прав для выполнения этой команды."

commands:
  lightning:
    enabled: true                       # тумблер команды
    permission: "skycommands.lightning" # право доступа
    cooldown-seconds: 5                 # кулдаун между ударами (0 — без кулдауна)
    strike-distance: 120
    show-message: true                  # показывать ли сообщение "Вы ударили молнией"
    message: "&eВы ударили молнией!"
    message-other: "&eВы ударили молнией по игроку &f%player%&e!"
    cooldown-message: "&cМолния будет доступна через %seconds% сек."
    player-not-found: "&cИгрок не найден."
    # Раскомментируй, чтобы заменить стандартное no-permission
    # только для этой команды:
    # permission-required: "&cМолния доступна только донатерам!"
