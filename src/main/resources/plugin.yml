name: SkyCommands
main: ru.player_skill.skycommands.SkyCommandsPlugin
version: 1.0.0
description: Плагин для собственных команд SkyGame
author: Alice AI под руководством PlayeR_SkiLL

commands:
  skycommands:
    description: Информация о SkyCommands
    usage: /skycommands
  lightning:
    description: Удар молнией без урона (в точку взгляда или по игроку)
    usage: /lightning [ник]
    aliases: [mylightning, zap, bolt, arc, volt]

permissions:
  skycommands.lightning:
    description: Доступ к команде /lightning
    default: false
  skycommands.lightning.otherplayer:
    description: Удар молнией по другому игроку (/lightning ник)
    default: op
  skycommands.admin:
    description: Перезагрузка конфига через /skycommands reload
    default: op
